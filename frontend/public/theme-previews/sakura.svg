<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Hotaru Sakura Theme Preview">
  <defs>
    <linearGradient id="bg_sakura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset=".5" stop-color="#fdf2f8"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="glow_sakura" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset=".5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow_sakura" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#f43f5e" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg_sakura)"/>
  <circle cx="120" cy="80" r="14" fill="#fbcfe8" opacity=".6"/>
  <circle cx="820" cy="120" r="18" fill="#fda4af" opacity=".5"/>
  <circle cx="870" cy="420" r="12" fill="#e9d5ff" opacity=".6"/>
  <rect x="140" y="70" width="680" height="400" rx="20" fill="rgba(255, 255, 255, 0.85)" stroke="rgba(251, 113, 133, 0.4)" stroke-width="1.5" filter="url(#shadow_sakura)"/>
  <rect x="140" y="70" width="680" height="4" rx="2" fill="url(#glow_sakura)"/>
  <g transform="translate(180 110)" font-family="Inter, system-ui, sans-serif">
    <text x="0" y="26" fill="#881337" font-size="26" font-weight="900" letter-spacing="-0.5">Hotaru ❀ Sakura</text>
    <text x="0" y="52" fill="#9f1239" font-size="14" font-weight="600">Osaka Kawaii • AMD Ryzen 7950X • 萌系梦幻粉樱</text>
    <rect x="520" y="4" width="80" height="30" rx="15" fill="#f43f5e"/>
    <text x="560" y="24" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">在线 ❀</text>
  </g>
  <g transform="translate(180 190)" font-family="Inter, system-ui, sans-serif">
    <rect width="180" height="96" rx="14" fill="rgba(255, 241, 242, 0.7)" stroke="#fecdd3"/>
    <text x="16" y="28" fill="#be123c" font-size="13" font-weight="700">CPU 负载</text>
    <text x="16" y="66" fill="#e11d48" font-size="30" font-weight="900">19.5%</text>
    <rect x="16" y="78" width="148" height="6" rx="3" fill="#ffe4e6"/>
    <rect x="16" y="78" width="30" height="6" rx="3" fill="#fb7185"/>
  </g>
  <g transform="translate(380 190)" font-family="Inter, system-ui, sans-serif">
    <rect width="180" height="96" rx="14" fill="rgba(253, 242, 248, 0.7)" stroke="#fbcfe8"/>
    <text x="16" y="28" fill="#9d174d" font-size="13" font-weight="700">内存占用</text>
    <text x="16" y="66" fill="#db2777" font-size="30" font-weight="900">42.8%</text>
    <rect x="16" y="78" width="148" height="6" rx="3" fill="#fce7f3"/>
    <rect x="16" y="78" width="63" height="6" rx="3" fill="#f472b6"/>
  </g>
  <g transform="translate(580 190)" font-family="Inter, system-ui, sans-serif">
    <rect width="180" height="96" rx="14" fill="rgba(245, 243, 255, 0.7)" stroke="#ddd6fe"/>
    <text x="16" y="28" fill="#6b21a8" font-size="13" font-weight="700">存储容量</text>
    <text x="16" y="66" fill="#9333ea" font-size="30" font-weight="900">51.2%</text>
    <rect x="16" y="78" width="148" height="6" rx="3" fill="#ede9fe"/>
    <rect x="16" y="78" width="76" height="6" rx="3" fill="#c084fc"/>
  </g>
  <g transform="translate(180 316)" font-family="Inter, system-ui, sans-serif">
    <rect width="580" height="88" rx="16" fill="rgba(255, 255, 255, 0.7)" stroke="#fecdd3"/>
    <text x="24" y="36" fill="#9f1239" font-size="14" font-weight="700">实时网络速率</text>
    <text x="24" y="66" fill="#e11d48" font-size="18" font-weight="800">↑ 18.2 MB/s</text>
    <text x="180" y="66" fill="#db2777" font-size="18" font-weight="800">↓ 95.4 MB/s</text>
    <text x="360" y="36" fill="#9f1239" font-size="14" font-weight="700">累计流量统计</text>
    <text x="360" y="66" fill="#9333ea" font-size="18" font-weight="800">2.4 TB / 10 TB</text>
  </g>
</svg>