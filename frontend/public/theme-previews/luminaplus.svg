<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="LuminaPlus Crystal Theme Preview">
  <defs>
    <linearGradient id="bg_lumi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glow_lumi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow_lumi" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0284c7" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg_lumi)"/>
  <rect x="140" y="70" width="680" height="400" rx="20" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" filter="url(#shadow_lumi)"/>
  <rect x="140" y="70" width="680" height="4" rx="2" fill="url(#glow_lumi)"/>
  <g transform="translate(180 110)" font-family="Inter, system-ui, sans-serif">
    <text x="0" y="26" fill="#f8fafc" font-size="26" font-weight="900" letter-spacing="-0.5">LuminaPlus • Crystal</text>
    <text x="0" y="52" fill="#94a3b8" font-size="14" font-weight="500">Tokyo Pro • AMD EPYC 9654 • 10 Gbps High Performance</text>
    <rect x="520" y="4" width="80" height="30" rx="15" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8"/>
    <text x="560" y="24" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="800">ONLINE</text>
  </g>
  <g transform="translate(180 190)" font-family="Inter, system-ui, sans-serif">
    <rect width="180" height="96" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)"/>
    <text x="16" y="28" fill="#94a3b8" font-size="13" font-weight="700">CPU LOAD</text>
    <text x="16" y="66" fill="#38bdf8" font-size="30" font-weight="900">28.4%</text>
    <rect x="16" y="78" width="148" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)"/>
    <rect x="16" y="78" width="42" height="6" rx="3" fill="#38bdf8"/>
  </g>
  <g transform="translate(380 190)" font-family="Inter, system-ui, sans-serif">
    <rect width="180" height="96" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)"/>
    <text x="16" y="28" fill="#94a3b8" font-size="13" font-weight="700">MEMORY</text>
    <text x="16" y="66" fill="#818cf8" font-size="30" font-weight="900">45.2%</text>
    <rect x="16" y="78" width="148" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)"/>
    <rect x="16" y="78" width="67" height="6" rx="3" fill="#818cf8"/>
  </g>
  <g transform="translate(580 190)" font-family="Inter, system-ui, sans-serif">
    <rect width="180" height="96" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)"/>
    <text x="16" y="28" fill="#94a3b8" font-size="13" font-weight="700">NVMe SSD</text>
    <text x="16" y="66" fill="#c084fc" font-size="30" font-weight="900">32.0%</text>
    <rect x="16" y="78" width="148" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)"/>
    <rect x="16" y="78" width="48" height="6" rx="3" fill="#c084fc"/>
  </g>
  <g transform="translate(180 316)" font-family="Inter, system-ui, sans-serif">
    <rect width="580" height="88" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="24" y="36" fill="#94a3b8" font-size="14" font-weight="700">NETWORK SPEED</text>
    <text x="24" y="66" fill="#38bdf8" font-size="18" font-weight="800">↑ 124.8 MB/s</text>
    <text x="180" y="66" fill="#34d399" font-size="18" font-weight="800">↓ 860.2 MB/s</text>
    <text x="360" y="36" fill="#94a3b8" font-size="14" font-weight="700">UPTIME / LATENCY</text>
    <text x="360" y="66" fill="#f8fafc" font-size="18" font-weight="800">99.98% • 18ms</text>
  </g>
