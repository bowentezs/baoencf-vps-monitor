name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify agent checksum manifest
        run: node scripts/sync-agent-sums.mjs --check

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Lint (frontend + worker typecheck)
        run: npm run lint

      - name: Build (frontend + worker)
        run: npm run build

      - name: Unit tests (frontend, worker, scripts)
        run: npm run test:node

      - name: Agent unit tests
        run: npm run test:agent
